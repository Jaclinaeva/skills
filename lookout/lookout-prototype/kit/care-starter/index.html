/* trix styling*/
trix-editor {
  border: 1px solid #bbb;
  border-radius: 3px;
  margin: 0;
  padding: 0.4em 0.6em;
  min-height: 5em;
  outline: none;
}

trix-toolbar * {
  box-sizing: border-box;
}

trix-toolbar .trix-button-row {
  display: flex;
  flex-wrap: nowrap;
  justify-content: space-between;
  overflow-x: auto;
}

trix-toolbar .trix-button-group {
  display: flex;
  margin-bottom: 10px;
  border: 1px solid #bbb;
  border-top-color: #ccc;
  border-bottom-color: #888;
  border-radius: 3px;
}

trix-toolbar .trix-button-group:not(:first-child) {
  margin-left: 1.5vw;
}


  trix-toolbar .trix-button-group:not(:first-child) {
    margin-left: 0;
  }

trix-toolbar .trix-button-group-spacer {
  flex-grow: 1;
}


  trix-toolbar .trix-button-group-spacer {
    display: none;
  }

trix-toolbar .trix-button {
  position: relative;
  float: left;
  color: rgba(0, 0, 0, 0.6);
  font-size: 0.75em;
  font-weight: 600;
  white-space: nowrap;
  padding: 0 0.5em;
  margin: 0;
  outline: none;
  border: none;
  border-bottom: 1px solid #ddd;
  border-radius: 0;
  background: transparent;
}

trix-toolbar .trix-button:not(:first-child) {
  border-left: 1px solid #ccc;
}

trix-toolbar .trix-button.trix-active {
  background: #cbeefa;
  color: rgb(0, 0, 0);
}

trix-toolbar .trix-button:not(:disabled) {

}

trix-toolbar .trix-button:disabled {
  color: rgba(0, 0, 0, 0.125);
}


  trix-toolbar .trix-button {
    letter-spacing: -0.01em;
    padding: 0 0.3em;
  }

trix-toolbar .trix-button--icon {

  height: 1.6em;

  }

trix-toolbar .trix-button--icon::before {
  display: inline-block;
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  opacity: 0.6;
  content: "";
  background-position: center;
  background-repeat: no-repeat;
  background-size: contain;
}


  trix-toolbar .trix-button--icon::before {
    right: 6%;
    left: 6%;
  }

trix-toolbar .trix-button--icon.trix-active::before {
  opacity: 1;
}

trix-toolbar .trix-button--icon:disabled::before {
  opacity: 0.125;
}

trix-toolbar .trix-dialogs {
  position: relative;
}

trix-toolbar .trix-dialog {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  font-size: 0.75em;
  padding: 15px 10px;
  background: #fff;
  box-shadow: 0 0.3em 1em #ccc;
  border-top: 2px solid #888;
  border-radius: 5px;
  z-index: 5;
}

trix-toolbar .trix-input--dialog {
  font-size: inherit;
  font-weight: normal;
  padding: 0.5em 0.8em;
  margin: 0 10px 0 0;
  border-radius: 3px;
  border: 1px solid #bbb;
  background-color: #fff;
  box-shadow: none;
  outline: none;
  -webkit-appearance: none;
  -moz-appearance: none;
}

trix-toolbar .trix-input--dialog.validate:invalid {
  box-shadow: #F00 0px 0px 1.5px 1px;
}

trix-toolbar .trix-button--dialog {
  font-size: inherit;
  padding: 0.5em;
  border-bottom: none;
}

trix-toolbar .trix-dialog--link {
  max-width: 600px;
}

trix-toolbar .trix-dialog__link-fields {
  display: flex;
  align-items: baseline;
}

trix-toolbar .trix-dialog__link-fields .trix-input {
  flex: 1 1;
}

trix-toolbar .trix-dialog__link-fields .trix-button-group {
  flex: 0 0 content;
  margin: 0;
}

trix-editor [data-trix-mutable]:not(.attachment__caption-editor) {
  -webkit-user-select: none;
  -moz-user-select: none;
  user-select: none;
}

trix-editor [data-trix-mutable] ::-moz-selection, trix-editor [data-trix-mutable]::-moz-selection,
trix-editor [data-trix-cursor-target]::-moz-selection {
  background: none;
}

trix-editor [data-trix-mutable] ::selection, trix-editor [data-trix-mutable]::selection,
trix-editor [data-trix-cursor-target]::selection {
  background: none;
}

trix-editor [data-trix-mutable].attachment__caption-editor:focus::-moz-selection {
  background: highlight;
}

trix-editor [data-trix-mutable].attachment__caption-editor:focus::selection {
  background: highlight;
}

trix-editor [data-trix-mutable].attachment.attachment--file {
  box-shadow: 0 0 0 2px highlight;
  border-color: transparent;
}

trix-editor [data-trix-mutable].attachment img {
  box-shadow: 0 0 0 2px highlight;
}

trix-editor .attachment {
  position: relative;
}

trix-editor .attachment:hover {
  cursor: default;
}

trix-editor .attachment--preview .attachment__caption:hover {
  cursor: text;
}

trix-editor .attachment__progress {
  position: absolute;
  z-index: 1;
  height: 20px;
  top: calc(50% - 10px);
  left: 5%;
  width: 90%;
  opacity: 0.9;
  transition: opacity 200ms ease-in;
}

trix-editor .attachment__progress[value="100"] {
  opacity: 0;
}

trix-editor .attachment__caption-editor {
  display: inline-block;
  width: 100%;
  margin: 0;
  padding: 0;
  font-size: inherit;
  font-family: inherit;
  line-height: inherit;
  color: inherit;
  text-align: center;
  vertical-align: top;
  border: none;
  outline: none;
  -webkit-appearance: none;
  -moz-appearance: none;
}

trix-editor .attachment__toolbar {
  position: absolute;
  z-index: 1;

    The background can't be transparent because of how the tick is drawn.

html {
  font-size: 16px;
  font-family: "Visuelt Pro", serif;
}

.flatpickr-calendar {
  background: transparent;
  opacity: 0;
  display: none;
  text-align: center;
  visibility: hidden;
  padding: 0;
  animation: none;
  direction: ltr;
  border: 0;
  font-size: 14px;
  line-height: 24px;
  border-radius: 5px;
  position: absolute;
  width: 307.875px;
  box-sizing: border-box;
  touch-action: manipulation;
  box-shadow: 0 3px 13px rgba(0, 0, 0, 0.08);
}

.flatpickr-calendar.open,
.flatpickr-calendar.inline {
  opacity: 1;
  max-height: 640px;
  visibility: visible;
}

.flatpickr-calendar.open {
  display: inline-block;
  z-index: 99999;
}

.flatpickr-calendar.animate.open {
  animation: fpFadeInDown 300ms cubic-bezier(0.23, 1, 0.32, 1);
}

.flatpickr-calendar.inline {
  display: block;
  position: relative;
  top: 2px;
}

.flatpickr-calendar.static {
  position: absolute;
  top: calc(100% + 2px);
}

.flatpickr-calendar.static.open {
  z-index: 999;
  display: block;
}

.flatpickr-calendar.multiMonth .flatpickr-days .dayContainer:nth-child(n+1) .flatpickr-day.inRange:nth-child(7n+7) {

  width: calc(100% - 10px);
  margin: 5px;
}

/* Use this mixin for any variations for desktop */
@keyframes slide-in {
  0% {
    transform: translateY(-100%);
  }
  8.3333333333% {
    transform: translateY(0%);
  }
  91.6666666667% {
    transform: translateY(0%);
  }
  100% {
    transform: translateY(-100%);
  }
}
.flash {
  transform: translateY(-100%);
  z-index: 99997;
  width: 100vw;
  position: fixed;
  background-color: #333570;
  display: flex;
  animation: 6s 1 slide-in 0.5s ease-out;
}

.flash__icon {
  height: 2.75rem;
  width: 2.75rem;
  border-radius: 50%;
  flex: 0 0 auto;
}

.flash__icon--notice {
  background: #01bdc5;
}

.flash__icon--alert {
  background: #d93e24;
}

.flash__text-container {
  margin-left: 1rem;
  align-self: center;
}

.flash__title {
  margin-top: 0;
  margin-bottom: 0.25rem;
  word-break: break-word;
}

.flash__content {
  margin: 0;
  word-break: break-word;
}

.care-rich-text-area-component trix-toolbar{
  border-top-left-radius: 0.5rem;
  border-top-right-radius: 0.5rem;
  border-width: 0px;
  border-bottom-width: 1px;
  border-style: solid;
  --tw-border-opacity: 1;
  border-color: rgb(82 84 154 / 1);
  position: sticky;
  top: 0px;
  --tw-bg-opacity: 1;
  background-color: rgb(255 255 255 / 1);
  z-index: 10;
}

@supports (color: rgb(0 0 0 / 0)){
.care-rich-text-area-component trix-toolbar{
    border-color: rgb(82 84 154 / var(--tw-border-opacity, 1));
    background-color: rgb(255 255 255 / var(--tw-bg-opacity, 1));
  }
}
.care-rich-text-area-component trix-toolbar .trix-button-group{
  border-width: 0px;
  margin: 0px;
}
.care-rich-text-area-component trix-toolbar .trix-button{
  border-width: 0px;
  cursor: pointer;
}
.care-rich-text-area-component trix-toolbar .trix-button:not(:first-child){
  border-width: 0px;
}
.care-rich-text-area-component trix-toolbar .trix-button:hover{
  opacity: 0.5;
}
.care-rich-text-area-component trix-toolbar .trix-button--icon{
  height: 2.5rem;
  width: 2.5rem;
  position: relative;
}
.care-rich-text-area-component trix-toolbar .trix-button--icon:before{
  height: 1.5rem;
  width: 1.5rem;
  position: absolute;
  left: 50%;
  top: 50%;
  --tw-translate-x: -50%;
  --tw-translate-y: -50%;
  transform: translate(-50%, -50%) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}
.care-rich-text-area-component trix-toolbar .trix-button-group--file-tools,
.care-rich-text-area-component trix-toolbar .trix-button--icon-decrease-nesting-level,
.care-rich-text-area-component trix-toolbar .trix-button--icon-increase-nesting-level,
.care-rich-text-area-component trix-toolbar .trix-button--icon-code {
  display: none;
}
.care-rich-text-area-component trix-editor{
  background-color: transparent;
  padding: 1rem;
  border-width: 0px;
  border-radius: 0px;
  -webkit-touch-callout: auto;
  -webkit-user-select: auto;
  -moz-user-select: auto;
  user-select: auto;
}

html {
  font-size: 16px;
  font-family: "Visuelt Pro", serif;
}

.spaced + .spaced {
  margin-top: 1rem;
}

.form__element {
  display: flex;
  padding: 0;
  position: relative;
  margin: 0;
  min-height: 0;
}
.form__element > input {
  width: 100%;
}

.form__element:disabled {
  opacity: 0.5;
  transition: opacity 0.2s ease-out;
}

.form__element.loading {
  opacity: 1;
}

html {
  font-size: 16px;
  font-family: "Visuelt Pro", serif;
}

.form_header--default {
  padding: 1.25rem 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  flex: 0 0 auto;
}

.form_header__title{
  font-size: 1.25rem;
  line-height: 1.75rem;
  line-height: 1.375;
  --tw-text-opacity: 1;
  color: rgb(51 53 112 / 1);
  margin-top: 1.25rem;
  margin-bottom: 0px;
}

@supports (color: rgb(0 0 0 / 0)){
.form_header__title{
    color: rgb(51 53 112 / var(--tw-text-opacity, 1));
  }
}

.form_header__subtitle{
  font-size: 1rem;
  line-height: 1.5rem;
  line-height: 1.5;
  --tw-text-opacity: 1;
  color: rgb(112 114 155 / 1);
  margin-top: 0.5rem;
  margin-bottom: 0px;
}

@supports (color: rgb(0 0 0 / 0)){
.form_header__subtitle{
    color: rgb(112 114 155 / var(--tw-text-opacity, 1));
  }
}

/* https://easings.net/#easeInOutCubic */
@keyframes scale_bounce {
  from {
    transform: scale(0);
    animation-timing-function: cubic-bezier(0.645, 0.045, 0.355, 1);
  }
  16.6666666667% {
    transform: scale(1.25);
    animation-timing-function: cubic-bezier(0.645, 0.045, 0.355, 1);
  }
  33.3333333333% {
    transform: scale(0.8333333333);
    animation-timing-function: cubic-bezier(0.645, 0.045, 0.355, 1);
  }
  50% {
    transform: scale(1.0416666667);
    animation-timing-function: cubic-bezier(0.645, 0.045, 0.355, 1);
  }
  66.6666666667% {
    transform: scale(0.9791666667);
    animation-timing-function: cubic-bezier(0.645, 0.045, 0.355, 1);
  }
  83.3333333333% {
    transform: scale(1.0208333333);
    animation-timing-function: cubic-bezier(0.645, 0.045, 0.355, 1);
  }
}
@keyframes scale_zero {
  from, to {
    transform: scale(0);
  }
}

html {

.helpers-visit-header__button_container {
  padding-top: 0;

  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #DEDEE7;

@supports (color: rgb(0 0 0 / 0)){
.helpers-visit-header__tabs{

.helpers-visit-header__tabs__tab {

}

}

  border-left: 1px solid #DEDEE7;
}

.helpers-visit-header__tabs__tab--disabled {

}

.helpers-visit-header__button__content {
  display: flex;

}

.helpers-visit-header__button__content__icon {

}

.helpers-visit__address_button {

html {
  font-size: 16px;
  font-family: "Visuelt Pro", serif;
}

.invoice__heading {
  line-height: 1.5;
}

.invoice__reference-label{
  font-size: 0.875rem;
  line-height: 1.25rem;
  line-height: 1.5;
  --tw-text-opacity: 1;
  color: rgb(112 114 155 / 1);
  display: block;
}

@supports (color: rgb(0 0 0 / 0)){
.invoice__reference-label{
    color: rgb(112 114 155 / var(--tw-text-opacity, 1));
  }
}

.invoice__tax_number{
  font-size: 0.875rem;
  line-height: 1.25rem;
  line-height: 1.5;
  --tw-text-opacity: 1;
  color: rgb(112 114 155 / 1);
  display: block;
}

@supports (color: rgb(0 0 0 / 0)){
.invoice__tax_number{
    color: rgb(112 114 155 / var(--tw-text-opacity, 1));
  }
}

.invoice__hr {
  border: none;
  height: 1px;
  color: #DEDEE7;
  background-color: #DEDEE7;
  margin: 0;
  padding: 0;
}

.invoice__preamble {
  margin: 0;
  line-height: 1.5;
}
.invoice__preamble dt:first-child {
  margin: 0;
}
.invoice__preamble dt{
  font-size: 0.875rem;
  line-height: 1.25rem;
  line-height: 1.5;
  --tw-text-opacity: 1;
  color: rgb(112 114 155 / 1);
  margin: 1rem 0 0;
}

@supports (color: rgb(0 0 0 / 0)){
.invoice__preamble dt{
    color: rgb(112 114 155 / var(--tw-text-opacity, 1));
  }
}
.invoice__preamble dd{
  font-size: 1rem;
  line-height: 1.5rem;
  font-weight: 500;
  line-height: 1.5;
  --tw-text-opacity: 1;
  color: rgb(51 53 112 / 1);
  margin: 0.375rem 0 0;
}

@supports (color: rgb(0 0 0 / 0)){
.invoice__preamble dd{
    color: rgb(51 53 112 / var(--tw-text-opacity, 1));
  }
}
.invoice__preamble p {
  margin: 0;
}

.invoice__items {
  list-style: none;
  counter-reset: invoice-items;
}

.invoice__item{
  font-size: 1rem;
  line-height: 1.5rem;
  font-weight: 500;
  --tw-text-opacity: 1;
  color: rgb(51 53 112 / 1);
  padding-top: 1.25rem;
  padding-bottom: 1.25rem;
  margin: 0;
  line-height: 1.5;
  counter-increment: invoice-items;
  position: relative;
  padding-left: 2.5rem;
}

@supports (color: rgb(0 0 0 / 0)){
.invoice__item{
    color: rgb(51 53 112 / var(--tw-text-opacity, 1));
  }
}
.invoice__item:before {
  content: counter(invoice-items) ".";
  display: block;
  position: absolute;
  left: 0;
  width: 2.5rem;
  text-align: right;
}

.invoice__item + .invoice__item {
  border-top: 1px solid #DEDEE7;
}

.invoice__item_extended_description{
  font-size: 0.875rem;
  line-height: 1.25rem;
  font-weight: 500;
  line-height: 1.5;
  --tw-text-opacity: 1;
  color: rgb(51 53 112 / 1);
  margin-top: 1rem;
}

@supports (color: rgb(0 0 0 / 0)){
.invoice__item_extended_description{
    color: rgb(51 53 112 / var(--tw-text-opacity, 1));
  }
}

.invoice__item-details {
  margin-top: 0.5rem;
  display: flex;
  flex-wrap: wrap;
}

.invoice__item-breakdown{
  font-size: 0.875rem;
  line-height: 1.25rem;
  line-height: 1.5;
  --tw-text-opacity: 1;
  color: rgb(112 114 155 / 1);
  flex: 1 0 auto;
  margin: 0;
  margin-right: 1rem;
  padding: 0.5rem 0;
}

.invoice__item-breakdown{
    color: rgb(112 114 155 / var(--tw-text-opacity, 1));
  }
}
.invoice__item-breakdown dt {
  float: left;
  display: block;
}
.invoice__item-breakdown dd {
  display: block;

}

.invoice__item-subtotal {
  font-size: 0.8rem;
  margin-bottom: 0.5rem;
}

  font-size: 0.8rem;
}

.invoice__item-total {
  flex: 1 0 auto;
  align-self: flex-end;
  text-align: right;
  line-height: 1.5;
  margin: 0;
  padding: 0.5rem 0;
}

.invoice__item-total-amount {
  margin: 0;
}

.invoice__footer {
  text-align: center;
  font-size: 0.875rem;
  line-height: 1.25rem;
  --tw-text-opacity: 1;
  color: rgb(51 53 112 / 1);

/* Prototype chrome for Care prototypes: the stage, the phone frame, the device status bar, the native app's
   navigation bar and the side panel. None of it is part of the Care app. Everything in the design is in #app. */
:root { color-scheme: light; --charcoal: #333570; --c70: #70729b; --border: #dedee7; --royal: #0034e5; --magenta: #b50575; --page: #e9eaf2; }

[hidden] { display: none !important; }

.stage { min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; gap: 40px; padding: 32px 24px; box-sizing: border-box; }
/* transform makes the phone the containing block for Care's fixed flash and modals */
.phone { width: 390px; height: 844px; background: #fff; border-radius: 44px; box-shadow: 0 0 0 10px #1c1d3a, 0 24px 60px rgba(22, 34, 80, .35); overflow: hidden; display: flex; flex-direction: column; position: relative; flex: none; transform: translateZ(0); }
.phone-status { height: 44px; background: #333570; color: #fff; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 26px 6px; font-size: 14px; font-weight: 500; flex: none; box-sizing: border-box; }
#app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.native-bar { display: flex; align-items: center; gap: 8px; padding: 10px 8px 8px; border-bottom: 1px solid var(--border); background: #fff; flex: none; min-height: 55px; box-sizing: border-box; }
.native-back { width: 36px; height: 36px; border: none; background: none; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--charcoal); cursor: pointer; padding: 0; }
.native-back svg { width: 20px; height: 20px; }
.native-title { flex: 1; margin: 0; font-size: 16px; font-weight: 500; text-align: center; padding-right: 44px; color: var(--charcoal); }
.native-bar.no-back .native-title { padding-left: 44px; }
.screen { flex: 1; min-height: 0; overflow-y: auto; position: relative; background: #fff; display: block; }

.notes { width: 340px; flex: none; position: sticky; top: 32px; font-size: 15px; line-height: 1.4; }
.notes h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
.notes .lede { color: var(--c70); margin: 0 0 20px; font-size: 14px; }
.notes :focus-visible { outline: 2px solid var(--royal); outline-offset: 2px; }
.scen { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
.scen .scen-label { font-size: 13px; font-weight: 500; color: var(--c70); }
.seg { display: flex; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.seg button { flex: 1; border: none; background: none; border-radius: 8px; padding: 8px 4px; font-size: 12.5px; white-space: nowrap; font-family: inherit; color: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--charcoal); color: #fff; }
.seg.seg-wrap { flex-wrap: wrap; }
.seg.seg-wrap button { flex: 1 1 45%; white-space: normal; }
.note-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.note-card .step { font-size: 13px; font-weight: 500; color: var(--magenta); margin-bottom: 4px; }
.note-card h2 { font-size: 16px; font-weight: 500; margin: 0 0 8px; }
.note-card ul { margin: 0; padding-left: 18px; font-size: 14px; }
.note-card li { margin: 6px 0; }
.note-card p { margin: 0; font-size: 14px; }
.restart { margin-top: 14px; border: none; background: none; color: var(--royal); padding: 0; font-size: 14px; font-family: inherit; cursor: pointer; }
/* The prototype bar pads the page and moves every .sticky.top-0 and full-screen overlay below itself. Inside the
   phone those sit in the phone's own box, so keep them where Care puts them. */
body.proto-bar-on .phone .sticky.top-0, body.proto-bar-on .phone .fixed.top-0, body.proto-bar-on .phone .fixed.inset-0, body.proto-bar-on .phone .fixed.inset-y-0 { top: 0 !important; }
body.proto-bar-on .notes { top: calc(var(--proto-bar-h) + 32px); }
@media (max-width: 820px) {
  .stage { flex-direction: column; align-items: center; gap: 28px; padding: 24px 16px; }
  .notes { position: static; width: min(390px, 100%); order: -1; }

@media (max-width: 480px) {

// Care components: each function returns a real Care component's rendered markup, marked with what it is.
// Markup is copied from the component's template in app/mounts/care/components/care/ in the Lookout repo, and its
// look comes from Care's own stylesheet (kit/care/care.css). Care prototypes use these, never UI or T2, whose
// classes are the admin's. Read a component's source before adding a function here; never guess its markup.
var CARE = (function () {
  var esc = UI.esc;
  // Every Care component is in code. Whether it's also in the design system is decided by catalog/ds-components.txt.
  function dc(name, props, note, slots) { return UI.dc(name, props, 'code', note, slots); }
  function act(o) { return UI.act(o); }
  function st(o) { return o && o.state ? ' data-state="' + esc(o.state) + '"' : ''; }
  // A transparent pixel. Care::AvatarComponent always renders a photo and has no initials fallback, so without a
  // photo the component's own placeholder circle shows.
  var PIXEL = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

  // An image from Care's image folder (care-assets.js), e.g. CARE.img('services/ic_car.svg').
  function img(file, size) {
    if (!CARE_ASSETS[file]) console.warn('No Care image named', file);
    return '<img src="' + (CARE_ASSETS[file] || '') + '" alt="" width="' + (size || 44) + '" height="' + (size || 44) + '">';
  }

  // Care::AvatarComponent. size: extra_small, small, medium, large, extra_large, extra_extra_large. shape: circle, square.
  function avatar(size, o) {
    o = o || {}; size = size || 'medium'; var shape = o.shape || 'circle';
    var props = { avatarable: 'record' }; if (size !== 'medium') props.size = size; if (shape !== 'circle') props.shape = shape;
    return '<img ' + dc('Care::AvatarComponent', props, o.src ? null : 'No photo in the prototype: the component\'s empty placeholder shows') +
      ' class="avatar--' + size + ' avatar--' + shape + '" src="' + (o.src || PIXEL) + '" alt="' + esc(o.alt || '') + '">';
  }

  // Care::TopnavComponent. items: [[id, label]], active: the selected id, o.a: the action a click calls with the id.
  function topnav(items, active, o) {
    o = o || {};
    return '<div ' + dc('Care::TopnavComponent', { user: 'current_user' }) + ' class="topnav">' +
      '<div class="topnav__logo"><img class="topnav__logo_img" src="' + CARE_ASSETS['lookout-logo-lockup-light.svg'] + '" height="24" alt="Lookout"></div>' +
      '<div class="topnav__menu">' + items.map(function (i) {
        var on = i[0] === active;
        return '<div class="topnav__menu-item--' + (on ? 'selected' : 'unselected') + '"><a href="#"' + (o.a ? act({ a: o.a, v: i[0] }) : '') + (on ? ' aria-current="page"' : '') + '>' + esc(i[1]) + '</a></div>';
      }).join('') + '</div>' +
      '<div class="topnav__actions"><div class="topnav__actions_bar"><a class="topnav__avatar" href="#" aria-label="' + esc(o.user || 'Your profile') + '">' + avatar('small') + '</a></div></div></div>';
  }

  // Care::SubtitleComponent: the band that starts a section. variant: default, blue, snowflake.
  var SUBTITLE = { 'default': 'text-white bg-charcoal border-charcoal-dark', blue: 'text-white bg-royal border-royal', snowflake: 'text-charcoal bg-snowflake border-charcoal-200' };
  function subtitle(text, o) {

  }

  // Care::Helpers::Visits::HeaderComponent: the top of a Helper's visit screen. tabs: [[id, label]] with the active id,

  function visitHeader(o) {

    }).join('') + '</div>' : '';
    return '<div ' + dc('Care::Helpers::Visits::HeaderComponent', { visit: 'visit' }) + '>' + tabs +
      '<div class="t-spaced h-spaced">' + personHeader(o.name, { subtitle: o.subtitle, src: o.src }) + '</div>' +
      '<div class="padded space-y-3">' + (o.body || '') + '</div>' + (o.actions ? '<div class="padded pt-0">' + o.actions + '</div>' : '') + '</div>';

    var pop = d.querySelector('[data-menu-pop]'); if (!d.open) { pop.classList.add('invisible'); return; }
    document.querySelectorAll(MENU + '[open]').forEach(function (o) { if (o !== d) o.open = false; });
    var r = d.querySelector('summary').getBoundingClientRect(); pop.style.top = (r.bottom + 6) + 'px'; pop.style.left = Math.max(8, r.right - pop.offsetWidth) + 'px'; pop.classList.remove('invisible');
  }, true);
  document.addEventListener('click', function (e) { document.querySelectorAll(MENU + '[open]').forEach(function (o) { if (!o.contains(e.target)) o.open = false; }); }, true);
  window.addEventListener('scroll', function () { document.querySelectorAll(MENU + '[open]').forEach(function (o) { o.open = false; }); }, true);

  // ---------- states ----------
  function stateById(id) { return app.states.filter(function (x) { return x.id === id; })[0]; }
  function goState(id) {
    var st = stateById(id); if (!st) return;
    var s = fresh(); if (st.set) st.set(s);
    app.state = s; Toolbar.setCurrent(id); draw(true);
    try { history.replaceState(null, '', '#state=' + encodeURIComponent(id)); } catch (e) {}
    Toolbar.flash(id);
  }
  function stateFromHash() { var m = location.hash.match(/^#state=(.+)$/); return m ? decodeURIComponent(m[1]) : null; }

  function start(o) {
    app.init = JSON.stringify(o.state || {}); app.state = fresh();
    app.actions = o.actions || {}; app.render = o.render; app.states = o.states || [];
    app.actions.toastHide = app.actions.toastHide || function () { document.getElementById('toast').hidden = true; };
    if (o.nav) NAV.config(o.nav);
    // template: 'care' runs the prototype in a phone, with toggles and notes beside it (care-shell.js).
    app.care = o.template === 'care';
    if (app.care) CareShell.init(o, {
      state: function () { return app.state; },
      redraw: function (reset) { Toolbar.setCurrent(null); draw(reset); },
      restart: function () { app.state = fresh(); Toolbar.setCurrent(null); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} draw(true); },
      act: function (name) { var fn = app.actions[name]; if (!fn) { console.warn('No action named', name); return; } fn(null, app.state); Toolbar.setCurrent(null); draw(); }
    });
    // The toolbar: Guide and Show components. Kit states must render their own id as data-state.
    Toolbar.init({
      scope: app.care ? '#app' : '#app, body > .fixed',
      // What's in the design system, from catalog/ds-components.txt (build.sh fills this in).
      inDs: ['Admin::AvatarComponent','Admin::BannerWithActionsComponent','Admin::BreadcrumbHeaderComponent','Admin::ButtonComponent','Admin::CalloutComponent','Admin::DefinitionListComponent','Admin::DividerComponent','Admin::EmptyPanelComponent','Admin::FloatingActionBarComponent','Admin::Form::CheckboxInsideLabelComponent','Admin::Form::ControlComponent','Admin::Form::HintComponent','Admin::Form::Input::CheckboxComponent','Admin::Form::Input::CheckboxToggleComponent','Admin::Form::Input::FieldComponent','Admin::Form::Input::RadioButtonCollectionComponent','Admin::Form::Input::SelectComponent','Admin::Form::Input::TextAreaComponent','Admin::Form::LabelComponent','Admin::Form::SectionComponent','Admin::HeaderComponent','Admin::HeadingComponent','Admin::HistoryItemComponent','Admin::HubspotWidgetToggleComponent','Admin::Layout::ConfirmModalComponent','Admin::LoaderComponent','Admin::MetricComponent','Admin::Modal::Component','Admin::MultiActionMenuComponent','Admin::PaginationComponent','Admin::PanelComponent','Admin::Payroll::AwardVersionCardComponent','Admin::Payroll::NewAwardVersionCardComponent','Admin::Popover::Component','Admin::Popover::ItemComponent','Admin::PrimaryNav::CollapsibleSectionComponent','Admin::PrimaryNav::Component','Admin::PrimaryNav::ItemComponent','Admin::PrimaryNav::Notifications::MenuComponent','Admin::PrimaryNav::UserMenuComponent','Admin::SegmentComponent','Admin::SegmentControlsComponent','Admin::Sidebar::CollapsibleSectionComponent','Admin::Sidebar::FilterGroupComponent','Admin::Sidebar::SectionComponent','Admin::TabComponent','Admin::TabbedHeaderComponent','Admin::Table::ActionsComponent','Admin::Table::BuilderComponent','Admin::TagComponent','Admin::WithCountComponent','Admin::WithTooltipComponent','FlashComponent'],
      states: app.states.map(function (x) { return { id: x.id, label: x.label, kind: x.kind, marker: x.id }; }),
      stories: o.stories || [], storiesSource: o.storiesSource || null, wireframe: !!o.wireframe,
      guide: o.guide || [], guideIntro: o.guideIntro || '', note: o.note, notDesigned: o.notDesigned || [],
      go: goState
    });
    var id = stateFromHash();
    if (id && stateById(id)) goState(id); else draw();
  }
  // The phone's content in a Care prototype: Proto.phone(top, screen, { id, bar }). See care-shell.js.
  function phone(top, screen, o) { return CareShell.phone(top, screen, o); }
  return { start: start, shell: shell, page: page, phone: phone, draw: draw, goState: goState };
})();
</script>
<script>
// Care starter: a prototype of the Care app (what Members and Helpers use), shown in a phone with its toggles and
// notes beside it. Copy this folder, rename it, and replace these screens with yours.
// Build it with: ../build.sh . "Page title"   (writes index.html next to this file)
//
// template: 'care' is what makes it a Care prototype. Every piece of a screen comes from CARE (kit/lib/care.js),
// which marks itself, laid out with the classes Care's own views use. Never use UI or T2 here: those are the admin's.
(function () {
  var state = {
    screen: 'visit',       // visit, checkout
    stage: 'in_progress',  // upcoming, in_progress, complete
    helper: 'employee'     // employee, contractor
  };
  var VISIT = { member: 'Patricia Sculthorpe', day: 'Today, 2 Nov', start: '8:00am', finish: '12:00pm' };

  var actions = {
    nav: function (v, s) { s.screen = 'visit'; },
    checkIn: function (v, s) { s.stage = 'in_progress'; },
    checkOut: function (v, s) { s.screen = 'checkout'; },
    finish: function (v, s) { s.stage = 'complete'; s.screen = 'visit'; },
    back: function (v, s) { s.screen = 'visit'; }
  };

  function top() { return CARE.topnav([['schedule', 'Schedule'], ['people', 'People'], ['notifications', 'Notifications']], 'schedule', { a: 'nav', user: 'Hilda Helper' }); }

  function visitScreen(s) {
    var chip = s.stage === 'complete' ? CARE.chip('complete', 'Checked out at ' + VISIT.finish, { state: 'visit:complete' })
      : s.stage === 'in_progress' ? CARE.chip('in_progress', 'Checked in at ' + VISIT.start, { subtitle: 'Check out when you finish the visit.', state: 'visit:in-progress' })
      : CARE.chip('pending', 'Starts at ' + VISIT.start, { state: 'visit:upcoming' });
    var mustDos = CARE.banner('2 must-dos', { variant: 'magenta', body: '<ul class="w-full m-0 pl-5 text-sm leading-snug"><li>Take out the rubbish</li><li>Make the beds</li></ul>' });
    var action = s.stage === 'upcoming' ? CARE.button('Check in', { link: true, a: 'checkIn' })
      : s.stage === 'in_progress' ? CARE.button('Check out', { link: true, a: 'checkOut' }) : '';
    var header = CARE.visitHeader({
      tabs: [['visit', 'Visit'], ['contacts', 'Contacts'], ['care-plan', 'Care plan'], ['notes', 'Notes']], active: 'visit',
      name: VISIT.member,
      body: CARE.duration({ day: VISIT.day, time: VISIT.start }, { day: VISIT.day, time: VISIT.finish }) + CARE.chips([chip]) + (s.stage === 'complete' ? '' : mustDos),
      actions: action
    });
    var rates = CARE.subtitle('Rates for this visit') +
      CARE.row('clock.svg', 'Duration', { value: '4 hours' }) +
      CARE.row('money.svg', 'Activities of daily living | Standard', { sub: 'Domestic Assistance' }) +
      // Support at Home only pays travel to contractors, so the row is the contractor's alone.
      (s.helper === 'contractor' ? CARE.row('services/ic_car.svg', 'Provider Travel (km)', { sub: 'Rate for travel distance to the visit', state: 'rates:travel' }) : '');
    var services = CARE.subtitle('Services for this visit') + CARE.row('services/ic_spraybottle.svg', 'Domestic Assistance');
    return Proto.phone(top(), header + rates + services, { id: 'visit' });
  }

  function checkoutScreen(s) {
    var body = '<div class="padded space-y-3" data-state="checkout:confirm">' +
      CARE.banner('Check out of your visit with Patricia', { subtitle: 'Your visit ran from ' + VISIT.start + ' to ' + VISIT.finish + '.' }) +
      CARE.button('Complete check-out', { block: true, a: 'finish' }) + '</div>';
    return Proto.phone(top(), body, { id: 'checkout', bar: { title: 'Check-out', back: 'back' } });
  }

  Proto.start({
    template: 'care',
    title: 'Care starter',
    intro: 'A Helper\'s visit screen, to show how a Care prototype is put together.',
    state: state,
    actions: actions,
    note: 'Example data',
    // The toggles beside the phone. Each one writes its choice into state at `key` and redraws.
    toggles: [
      { key: 'stage', label: 'Visit', options: [['upcoming', 'Upcoming'], ['in_progress', 'In progress'], ['complete', 'Complete']],
        on: function (v, s) { s.screen = 'visit'; } },
      { key: 'helper', label: 'Helper', options: [['employee', 'Employee'], ['contractor', 'Contractor']],
        show: function (s) { return s.screen === 'visit'; } }
    ],
    // What a reviewer should notice on the screen showing now.
    notes: function (s) {
      if (s.screen === 'checkout') return { label: 'Check-out', title: 'One step to check out', points: ['The native app adds the bar with the back button; Care\'s own pages don\'t have one.'] };
      return { label: 'Visit screen', title: 'The visit, its state and its rates', points: [
        'The chip under the times says where the visit is up to.',
        s.helper === 'contractor' ? 'A contractor also sees the travel rate.' : 'An employee sees no travel rate.'
      ] };
    },
    // Every state a reviewer or engineer needs to see. Each id matches a data-state on the screen.
    states: [
      { id: 'visit:in-progress', label: 'Visit, checked in' },
      { id: 'visit:upcoming', label: 'Visit, before check-in', set: function (s) { s.stage = 'upcoming'; } },
      { id: 'checkout:confirm', label: 'Check-out', set: function (s) { s.screen = 'checkout'; } },
      { id: 'visit:complete', label: 'Visit, checked out', set: function (s) { s.stage = 'complete'; } },
      { id: 'rates:travel', label: 'Rates for a contractor', kind: 'edge', set: function (s) { s.helper = 'contractor'; } }
    ],
    storiesSource: { title: 'Example stories' },
    stories: [
      { id: 'S1', title: 'Check out of a visit', story: 'As a Helper, I want to check out when I finish, so that my visit is recorded.',
        steps: [
          { state: 'visit:in-progress', title: 'Checked in', text: 'The visit while it\'s under way' },
          { state: 'checkout:confirm', title: 'Check out', text: 'One step to confirm' },
          { state: 'visit:complete', title: 'Checked out', text: 'The visit afterwards' }
        ],
        other: [
          { state: 'visit:upcoming', how: 'Before the Helper checks in' },
          { state: 'rates:travel', how: 'When the Helper is a contractor' }
        ],
        notDesigned: [{ label: 'Check-out fails', reason: 'An example, not a real flow' }] }
    ],
    render: function (s) { return s.screen === 'checkout' ? checkoutScreen(s) : visitScreen(s); }
  });
})();
</script>
